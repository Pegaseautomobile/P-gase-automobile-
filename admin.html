<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Pégase Automobile</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f5f7;
      color: #111;
    }

    header {
      background: #0b0d10;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header span {
      color: #d6a84f;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      margin-bottom: 25px;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: 0;
      border-radius: 8px;
      background: #d6a84f;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .logout {
      background: #222;
      color: white;
    }

    .delete {
      background: #c62828;
      color: white;
    }

    .hidden {
      display: none;
    }

    .car {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
    }

    .car h3 {
      margin: 0 0 8px;
    }

    .car p {
      margin: 5px 0;
      color: #555;
    }

    #message, #loginMessage {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>PÉGASE <span>AUTOMOBILE</span></h1>
  <p>Administration</p>
</header>

<div class="container">

  <!-- CONNEXION -->

  <div class="box" id="loginBox">

    <h2>Connexion administrateur</h2>

    <label>Email</label>
    <input type="email" id="email">

    <label>Mot de passe</label>
    <input type="password" id="password">

    <button onclick="connexion()">
      Se connecter
    </button>

    <div id="loginMessage"></div>

  </div>


  <!-- ADMIN -->

  <div class="hidden" id="adminBox">

    <!-- AJOUT -->

    <div class="box">

      <h2>➕ Ajouter un véhicule</h2>

      <form id="carForm">

        <label>Marque</label>
        <input type="text" id="marque" required>

        <label>Modèle</label>
        <input type="text" id="modele" required>

        <label>Prix (€)</label>
        <input type="number" id="prix" required>

        <label>Année</label>
        <input type="number" id="annee" required>

        <label>Kilométrage</label>
        <input type="number" id="kilometrage" required>

        <label>Carburant</label>
        <select id="carburant">
          <option>Essence</option>
          <option>Diesel</option>
          <option>Hybride</option>
          <option>Électrique</option>
        </select>

        <label>Boîte</label>
        <select id="boite">
          <option>Manuelle</option>
          <option>Automatique</option>
        </select>

        <label>URL de la photo</label>
        <input type="url" id="image_url">

        <label>Description</label>
        <textarea id="description"></textarea>

        <button type="submit">
          Publier le véhicule
        </button>

      </form>

      <div id="message"></div>

    </div>


    <!-- LISTE DES ANNONCES -->

    <div class="box">

      <h2>🚗 Mes véhicules</h2>

      <div id="listeVoitures">
        Chargement...
      </div>

    </div>


    <div class="box">

      <button class="logout" onclick="deconnexion()">
        Se déconnecter
      </button>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://rrojspgdsgxjhekyuxlq.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_qA0XGZifK4Xque85HxxsZg_lNrHgRuE";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


// CONNEXION

async function connexion() {

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {

    document.getElementById("loginMessage").textContent =
      "❌ Email ou mot de passe incorrect.";

    return;
  }

  document.getElementById("loginBox")
    .classList.add("hidden");

  document.getElementById("adminBox")
    .classList.remove("hidden");

  chargerVoitures();
}


// DÉCONNEXION

async function deconnexion() {

  await supabaseClient.auth.signOut();

  location.reload();
}


// AJOUTER UNE VOITURE

document.getElementById("carForm")
.addEventListener("submit", async function(event) {

  event.preventDefault();

  const voiture = {

    marque: document.getElementById("marque").value,
    modele: document.getElementById("modele").value,
    prix: Number(document.getElementById("prix").value),
    annee: Number(document.getElementById("annee").value),
    kilometrage: Number(document.getElementById("kilometrage").value),
    carburant: document.getElementById("carburant").value,
    boite: document.getElementById("boite").value,
    image_url: document.getElementById("image_url").value,
    description: document.getElementById("description").value

  };


  const { error } =
    await supabaseClient
      .from("Voitures")
      .insert([voiture]);


  if (error) {

    document.getElementById("message").textContent =
      "❌ Erreur : " + error.message;

    return;
  }


  document.getElementById("message").textContent =
    "✅ Véhicule ajouté !";

  document.getElementById("carForm").reset();

  chargerVoitures();

});


// AFFICHER LES VOITURES

async function chargerVoitures() {

  const { data, error } =
    await supabaseClient
      .from("voitures")
      .select("*")
      .order("id", { ascending: false });


  const liste =
    document.getElementById("listeVoitures");


  if (error) {

    liste.innerHTML =
      "❌ Impossible de charger les annonces.";

    return;
  }


  if (!data || data.length === 0) {

    liste.innerHTML =
      "Aucune voiture actuellement.";

    return;
  }


  liste.innerHTML = "";


  data.forEach(voiture => {

    const element =
      document.createElement("div");

    element.className = "car";

    element.innerHTML = `

      <h3>
        ${voiture.marque} ${voiture.modele}
      </h3>

      <p>
        ${voiture.prix} € —
        ${voiture.annee} —
        ${voiture.kilometrage} km
      </p>

      <button
        class="delete"
        onclick="supprimerVoiture(${voiture.id})">
        🗑️ Supprimer cette annonce
      </button>

    `;

    liste.appendChild(element);

  });

}


// SUPPRIMER UNE VOITURE

async function supprimerVoiture(id) {

  const confirmation =
    confirm(
      "Voulez-vous vraiment supprimer cette annonce ?"
    );


  if (!confirmation) {
    return;
  }


  const { error } =
    await supabaseClient
      .from("voitures")
      .delete()
      .eq("id", id);


  if (error) {

    alert(
      "❌ Suppression impossible : " +
      error.message
    );

    return;
  }


  alert("✅ Annonce supprimée.");

  chargerVoitures();

}

</script>

</body>
</html>
