<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administration - Pégase Automobile</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    .photo-box {
      border: 2px dashed #aaa;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-top: 10px;
    }

    .photo-box p {
      margin-top: 0;
    }

    .photo-button {
      background: #111;
    }

    .hidden-input {
      display: none;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 15px;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #d4edda;
      color: #155724;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
    }

    .car {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
    }

    .car img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 10px;
    }

    .car h3 {
      margin-bottom: 8px;
    }

    .delete {
      background: #c62828;
    }

    .delete:hover {
      background: #a61d1d;
    }

    #adminContent {
      display: none;
    }

    #loginBox {
      max-width: 450px;
      margin: 50px auto;
    }
  </style>
</head>

<body>

<header>
  <h1>PÉGASE AUTOMOBILE</h1>
  <p>Administration</p>
</header>


<!-- ============================= -->
<!-- CONNEXION -->
<!-- ============================= -->

<div id="loginBox" class="box">

  <h2>Connexion administrateur</h2>

  <label>Email</label>

  <input
    type="email"
    id="email"
    placeholder="Votre email"
  >

  <label>Mot de passe</label>

  <input
    type="password"
    id="password"
    placeholder="Votre mot de passe"
  >

  <button onclick="connexion()">
    Se connecter
  </button>

  <div id="loginMessage" class="message"></div>

</div>


<!-- ============================= -->
<!-- ESPACE ADMIN -->
<!-- ============================= -->

<div id="adminContent">

  <div class="container">

    <!-- AJOUTER UNE VOITURE -->

    <div class="box">

      <h2>Ajouter une voiture</h2>

      <form id="carForm">

        <label>Marque</label>

        <input
          type="text"
          id="marque"
          required
        >


        <label>Modèle</label>

        <input
          type="text"
          id="modele"
          required
        >


        <label>Prix (€)</label>

        <input
          type="number"
          id="prix"
          required
        >


        <label>Année</label>

        <input
          type="number"
          id="annee"
          required
        >


        <label>Kilométrage</label>

        <input
          type="number"
          id="kilometrage"
          required
        >


        <label>Carburant</label>

        <select id="carburant">

          <option>Essence</option>
          <option>Diesel</option>
          <option>Hybride</option>
          <option>Électrique</option>

        </select>


        <label>Boîte</label>

        <select id="boite">

          <option>Manuelle</option>
          <option>Automatique</option>

        </select>


        <!-- ============================= -->
        <!-- PHOTO GALERIE -->
        <!-- ============================= -->

        <label>Photo du véhicule</label>

        <div class="photo-box">

          <p>🖼️ Ajoute une photo du véhicule</p>

          <button
            type="button"
            class="photo-button"
            onclick="choisirPhoto()"
          >
            🖼️ Importer une photo depuis la galerie
          </button>

          <input
            type="file"
            id="galleryInput"
            class="hidden-input"
            accept="image/*"
          >

          <img
            id="preview"
            alt="Aperçu de la voiture"
          >

        </div>


        <!-- ============================= -->
        <!-- DESCRIPTION -->
        <!-- ============================= -->

        <label>Description</label>

        <textarea
          id="description"
          placeholder="Décrivez le véhicule..."
        ></textarea>


        <button type="submit">
          🚗 Ajouter la voiture
        </button>

      </form>

      <div id="message" class="message"></div>

    </div>


    <!-- ============================= -->
    <!-- LISTE DES VOITURES -->
    <!-- ============================= -->

    <div class="box">

      <h2>Véhicules actuellement en ligne</h2>

      <div id="carsList">
        Chargement...
      </div>

    </div>

  </div>

</div>


<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://rrojspgdsgxjhekyuxlq.supabase.co";

  // ⚠️ REMETS ICI TA CLÉ SUPABASE ACTUELLE

  const SUPABASE_KEY =
    "sb_publishable_qA0XGZifK4Xque85HxxsZg_lNrHgRuE";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // CONNEXION
  // ==========================================

  async function connexion() {

    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("loginMessage");


    message.style.display = "block";

    message.className = "message";

    message.textContent = "Connexion...";


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,
        password: password

      });


    if (error) {

      message.className =
        "message error";

      message.textContent =
        error.message;

      return;
    }


    message.className =
      "message success";

    message.textContent =
      "Connexion réussie !";


    document.getElementById("loginBox")
      .style.display = "none";


    document.getElementById("adminContent")
      .style.display = "block";


    chargerVoitures();

  }


  // ==========================================
  // CHOISIR UNE PHOTO DANS LA GALERIE
  // ==========================================

  function choisirPhoto() {

    document
      .getElementById("galleryInput")
      .click();

  }


  // ==========================================
  // APERÇU DE LA PHOTO
  // ==========================================

  document
    .getElementById("galleryInput")
    .addEventListener("change", function() {

      const fichier = this.files[0];

      if (!fichier) {
        return;
      }

      const preview =
        document.getElementById("preview");

      preview.src =
        URL.createObjectURL(fichier);

      preview.style.display =
        "block";

    });


  // ==========================================
  // AJOUTER UNE VOITURE
  // ==========================================

  document
    .getElementById("carForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();


      const message =
        document.getElementById("message");


      message.style.display =
        "block";

      message.className =
        "message";

      message.textContent =
        "Ajout de la voiture...";


      try {

        // Vérifier que l'utilisateur est connecté

        const {
          data: { user }
        } =
          await supabaseClient.auth.getUser();


        if (!user) {

          throw new Error(
            "Vous devez être connecté."
          );

        }


        // ==================================
        // RÉCUPÉRER LA PHOTO
        // ==================================

        const fichier =
          document
            .getElementById("galleryInput")
            .files[0];


        let image_url = "";


        // ==================================
        // ENVOYER LA PHOTO DANS SUPABASE
        // ==================================

        if (fichier) {

          const extension =
            fichier.name
              .split(".")
              .pop()
              .toLowerCase();


          const nomFichier =
            Date.now() +
            "-" +
            Math.random()
              .toString(36)
              .substring(2) +
            "." +
            extension;


          const {
            error: uploadError
          } =
            await supabaseClient.storage
              .from("voitures")
              .upload(
                nomFichier,
                fichier,
                {
                  cacheControl: "3600",
                  upsert: false
                }
              );


          if (uploadError) {

            throw uploadError;

          }


          // ==================================
          // RÉCUPÉRER L'URL PUBLIQUE
          // ==================================

          const {
            data: publicUrlData
          } =
            supabaseClient.storage
              .from("voitures")
              .getPublicUrl(
                nomFichier
              );


          image_url =
            publicUrlData.publicUrl;

        }


        // ==================================
        // CRÉER LA VOITURE
        // ==================================

        const voiture = {

          marque:
            document
              .getElementById("marque")
              .value,

          modele:
            document
              .getElementById("modele")
              .value,

          prix:
            Number(
              document
                .getElementById("prix")
                .value
            ),

          annee:
            Number(
              document
                .getElementById("annee")
                .value
            ),

          kilometrage:
            Number(
              document
                .getElementById("kilometrage")
                .value
            ),

          carburant:
            document
              .getElementById("carburant")
              .value,

          boite:
            document
              .getElementById("boite")
              .value,

          image_url:
            image_url,

          description:
            document
              .getElementById("description")
              .value

        };


        // ==================================
        // ENREGISTRER DANS LA TABLE
        // ==================================

        const {
          error
        } =
          await supabaseClient
            .from("Voiture")
            .insert([voiture]);


        if (error) {

          throw error;

        }


        // ==================================
        // MESSAGE DE SUCCÈS
        // ==================================

        message.className =
          "message success";

        message.textContent =
          "✅ Voiture ajoutée avec succès !";


        // Vider le formulaire

        document
          .getElementById("carForm")
          .reset();


        // Cacher l'aperçu

        document
          .getElementById("preview")
          .style.display = "none";


        // Recharger la liste

        chargerVoitures();


      } catch (error) {

        console.error(error);


        message.className =
          "message error";


        message.textContent =
          "❌ Erreur : " +
          error.message;

      }

    });


  // ==========================================
  // CHARGER LES VOITURES
  // ==========================================

  async function chargerVoitures() {

    const carsList =
      document.getElementById("carsList");


    carsList.innerHTML =
      "Chargement...";


    const {
      data,
      error
    } =
      await supabaseClient
        .from("Voiture")
        .select("*")
        .order(
          "id",
          {
            ascending: false
          }
        );


    if (error) {

      carsList.innerHTML =
        "Erreur : " +
        error.message;

      return;

    }


    if (!data || data.length === 0) {

      carsList.innerHTML =
        "Aucune voiture pour le moment.";

      return;

    }


    carsList.innerHTML = "";


    data.forEach(function(voiture) {

      const div =
        document.createElement("div");


      div.className =
        "car";


      div.innerHTML = `

        ${
          voiture.image_url
            ? `
              <img
                src="${voiture.image_url}"
                alt="${voiture.marque} ${voiture.modele}"
              >
            `
            : ""
        }

        <h3>
          ${voiture.marque}
          ${voiture.modele}
        </h3>

        <p>
          <strong>
            ${voiture.prix} €
          </strong>
        </p>

        <p>
          ${voiture.annee || ""}
          •
          ${voiture.kilometrage || ""} km
        </p>

        <p>
          ${voiture.carburant || ""}
          •
          ${voiture.boite || ""}
        </p>

        <p>
          ${voiture.description || ""}
        </p>

        <button
          class="delete"
          onclick="supprimerVoiture(${voiture.id})"
        >
          🗑️ Supprimer
        </button>

      `;


      carsList.appendChild(div);

    });

  }


  // ==========================================
  // SUPPRIMER UNE VOITURE
  // ==========================================

  async function supprimerVoiture(id) {

    const confirmation =
      confirm(
        "Voulez-vous vraiment supprimer cette voiture ?"
      );


    if (!confirmation) {
      return;
    }


    const {
      error
    } =
      await supabaseClient
        .from("Voiture")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "Erreur lors de la suppression : " +
        error.message
      );

      return;

    }


    alert(
      "Voiture supprimée."
    );


    chargerVoitures();

  }

</script>

</body>
</html>
